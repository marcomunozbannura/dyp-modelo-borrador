<!DOCTYPE html>
<html lang="es-CL" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Este modelo se publica para que el cliente lo pruebe desde su telefono, no
     para que aparezca en buscadores. Se comparte por link, no se indexa. -->
<meta name="robots" content="noindex, nofollow">
<title>Automotora DyP · Control de Taller — Modelo Borrador</title>
<link rel="stylesheet" href="css/estilos.css">
<script>
  // Se aplica antes de pintar para que no haya un destello del tema anterior.
  try {
    var t = localStorage.getItem('dyp-tema');
    if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
  } catch (e) { /* file:// sin almacenamiento: queda el tema por defecto */ }
</script>
</head>
<body>

<div class="app">

  <!-- Barra de menú -->
  <div class="barra-menu">
    <span class="prod" id="prod"></span>
    <span class="mnu">Archivo</span>
    <span class="mnu">Edición</span>
    <span class="mnu">Ver</span>
    <span class="mnu">Procesos</span>
    <span class="mnu">Reportes</span>
    <span class="mnu">Ayuda</span>
    <span class="der">
      <span class="usr" id="usr"></span>
      <button id="btn-tema" type="button">Tema oscuro</button>
    </span>
  </div>

  <div class="marco">

    <!-- Navegador de módulos -->
    <aside class="sidebar">
      <div class="tit">Módulos</div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="principal">

      <header class="cab-modulo">
        <div class="ruta" id="ruta"></div>
        <h1 id="titulo"></h1>
        <p class="bajada" id="bajada"></p>
        <div class="tabs" id="tabs"></div>
      </header>

      <div class="herramientas" id="herramientas"></div>

      <div class="contenido" id="contenido"></div>

    </main>
  </div>

  <!-- Barra de estado -->
  <div class="barra-estado" id="estado-barra"></div>

</div>

<!-- Orden obligatorio: las reglas no dependen de nadie, la semilla depende de
     las reglas (arma los números de OR), el repositorio depende de las dos, y
     las vistas dependen del repositorio. `app.js` va último porque al cargar
     ya pinta, y para eso necesita que las vistas estén definidas. -->
<script src="js/iconos.js"></script>
<script src="js/reglas.js"></script>
<script src="js/semilla.js"></script>
<script src="js/modelo.js"></script>
<script src="js/media.js"></script>
<script src="js/pruebas.js"></script>
<script src="js/vistas/silueta.js"></script>
<script src="js/vistas/fotos.js"></script>
<script src="js/vistas/recepcion.js"></script>
<script src="js/vistas/torre.js"></script>
<script src="js/vistas/mitrabajo.js"></script>
<script src="js/vistas/ingreso.js"></script>
<script src="js/vistas/etapas.js"></script>
<script src="js/vistas/impresos.js"></script>
<script src="js/vistas/ficha.js"></script>
<script src="js/vistas/presupuesto.js"></script>
<script src="js/vistas/bodega.js"></script>
<script src="js/vistas/entrega.js"></script>
<script src="js/vistas/historico.js"></script>
<script src="js/vistas/expediente.js"></script>
<script src="js/vistas/personal.js"></script>
<script src="js/vistas/documentos.js"></script>
<script src="js/vistas/configuracion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
